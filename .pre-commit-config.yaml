# Local hooks only: this repository does not vendor third-party hook repos.
# Install once with `pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: comment-language
        name: comment style
        description: English only, plain '#' prefix; rejects CJK text and '#:' comments.
        entry: python3 scripts/check_comment_language.py
        language: system
        types_or: [python, toml, yaml, shell, ini]
        pass_filenames: true

      - id: ruff
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
